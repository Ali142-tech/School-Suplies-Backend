
name: Deploy Laravel to AWS Elastic Beanstalk

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Create deployment bundle
        run: |
          zip -r deploy.zip . \
            -x ".git/*" \
               ".github/*" \
               "node_modules/*" \
               "vendor/*" \
               ".env" \
               ".env.*" \
               "storage/logs/*"

      - name: Upload bundle and create application version
        env:
          AWS_REGION: ap-southeast-2
          EB_APPLICATION: printinf-staging
          EB_ENVIRONMENT: Printinf-staging-env
        run: |
          VERSION_LABEL="github-${GITHUB_SHA}-${GITHUB_RUN_ID}"
          BUCKET=$(aws elasticbeanstalk create-storage-location \
            --region "$AWS_REGION" \
            --query S3Bucket \
            --output text)

          aws s3 cp deploy.zip "s3://${BUCKET}/${VERSION_LABEL}.zip"

          aws elasticbeanstalk create-application-version \
            --region "$AWS_REGION" \
            --application-name "$EB_APPLICATION" \
            --version-label "$VERSION_LABEL" \
            --source-bundle S3Bucket="$BUCKET",S3Key="${VERSION_LABEL}.zip"

          aws elasticbeanstalk update-environment \
            --region "$AWS_REGION" \
            --environment-name "$EB_ENVIRONMENT" \
            --version-label "$VERSION_LABEL"
